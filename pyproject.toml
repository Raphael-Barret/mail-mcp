[project]
name = "mail-mcp"
version = "0.1.0"
description = "Serveur MCP mail multi-comptes, lecture seule par défaut"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
dependencies = ["mcp>=2", "keyring>=25"]

[dependency-groups]
dev = ["pytest>=8"]

[project.scripts]
mail-mcp = "mail_mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mail_mcp"]

[tool.pytest.ini_options]
testpaths = ["tests"]
