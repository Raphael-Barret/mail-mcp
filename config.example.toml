# Copy to the configuration file (see the README: ~/.config/mail-mcp/config.toml,
# or %APPDATA%\mail-mcp\config.toml on Windows), or point MAIL_MCP_CONFIG at it.
# Secrets never go here: they are read from the system keychain
# (service "mail-mcp", username = account name), see `mail-mcp set-secret`.
#
# Every account is read-only. To allow writes, list the wanted capabilities
# in `allow` (permitted: "draft", "archive").

[accounts.gmail]
backend = "imap"
host = "imap.gmail.com"
port = 993
security = "ssl"            # ssl | starttls
username = "you@gmail.com"
allow = ["draft", "archive"]   # optional

[accounts.school]
backend = "imap"
host = "imap.example.edu"
port = 993
security = "ssl"
username = "you@example.edu"
allow = ["draft"]
# address = "you@example.edu"     # sender of drafts if different from username
# drafts_folder = "Drafts"        # otherwise detected (\Drafts attribute or usual name)
# archive_folder = "Archive"      # required if the server has no recognised archive folder
